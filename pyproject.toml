[project]
name = "forge"
version = "0.1.0"
description = "FORGE: compile drawn payoffs into Orca concentrated liquidity on Solana"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy==2.3.5",
    "scipy==1.16.3",
    "highspy==1.12.0",
]

[project.optional-dependencies]
api = [
    "fastapi==0.122.0",
    "uvicorn[standard]==0.38.0",
    "pydantic==2.12.5",
]
bench = [
    "requests==2.32.5",
]

[dependency-groups]
dev = [
    "pytest==9.0.1",
    "hypothesis==6.148.2",
    "ruff==0.14.6",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "math/forge_math",
    "compiler/forge_compiler",
    "verifier/forge_verifier",
    "services/compiler-api/forge_api",
]

[tool.pytest.ini_options]
testpaths = ["math/tests", "compiler/tests", "verifier/tests", "services/compiler-api/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741"]
